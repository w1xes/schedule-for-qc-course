[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    basic: Basic E2E tests (Task 1)
    page_objects: Tests using Page Objects (Task 2)
    complex: Complex scenario tests (Task 3)
    db: Tests with DB verification (Task 4)
