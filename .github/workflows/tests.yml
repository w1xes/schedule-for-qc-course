name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # Unit Tests (Jest — frontend)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false '--coverageThreshold={}'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

  # ============================================
  # API Tests (Newman / Postman)
  # ============================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          newman run "schedule-testing/tests/api/postman/Schedule_API_Tests.postman_collection.json" \
            -e "schedule-testing/tests/api/postman/schedule-local.postman_environment.json" \
            -r htmlextra \
            --reporter-htmlextra-export newman-report.html
        continue-on-error: true

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: newman-report.html
          retention-days: 7

  # ============================================
  # E2E Tests (pytest + Playwright) — matrix
  # ============================================
  e2e-tests:
    name: E2E Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: api-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: schedule-testing/e2e/requirements.txt

      - name: Install Python dependencies
        working-directory: schedule-testing/e2e
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: schedule-testing/e2e
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: schedule-testing/e2e
        run: pytest tests/ --html=pytest-report.html --self-contained-html -v
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}
          API_URL: ${{ secrets.API_URL || 'http://localhost:8080' }}
        continue-on-error: true

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: schedule-testing/e2e/pytest-report.html
          retention-days: 7

  # ============================================
  # Summary
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Unit Tests:  ${{ needs.unit-tests.result }}"
          echo "API Tests:   ${{ needs.api-tests.result }}"
          echo "E2E Tests:   ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" == "failure" ] || \
             [ "${{ needs.api-tests.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "One or more jobs failed!"
            exit 1
          fi

          echo "All tests passed!"
