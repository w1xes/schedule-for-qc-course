name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Task 1 — Unit Tests (Java / Gradle)
  # Requires a PostgreSQL service container because the test
  # application.yml connects to jdbc:postgresql://localhost:5432/schedule_test
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schedule_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test
        env:
          # OAuth2 client IDs must be present even for tests; dummy values are fine
          # because CacheConfiguration and OAuth2 flows are disabled in the test profile
          GOOGLE_CLIENT_ID: disabled
          GOOGLE_CLIENT_SECRET: disabled
          FACEBOOK_CLIENT_ID: disabled
          FACEBOOK_CLIENT_SECRET: disabled

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/reports/tests/
          retention-days: 7

  # ============================================================
  # Task 2 — API Tests (Newman / Postman)
  # Runs after unit tests; spins up the full stack via Docker Compose
  # ============================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle (ensures gradle-wrapper.jar exists for Docker build context)
        uses: gradle/actions/setup-gradle@v4

      - name: Start services via Docker Compose
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d --build

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ 2>/dev/null || echo "000")
            if [ "$STATUS" != "000" ]; then
              echo "App is ready (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "App failed to start after 5 minutes"
          docker compose logs app
          exit 1

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests
        run: |
          newman run \
            "schedule-testing/tests/api/postman/Schedule_API_Tests.postman_collection.json" \
            -e "schedule-testing/tests/api/postman/schedule-local.postman_environment.json" \
            -r htmlextra \
            --reporter-htmlextra-export newman-report.html
        continue-on-error: true

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: newman-report.html
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down

  # ============================================================
  # Task 1 (E2E part) + Task 3 — E2E Tests with Python version matrix
  # Matrix: Python 3.10, 3.11, 3.12 — each job gets its own runner
  # ============================================================
  e2e-tests:
    name: E2E Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: api-tests

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle (ensures gradle-wrapper.jar exists for Docker build context)
        uses: gradle/actions/setup-gradle@v4

      - name: Start services via Docker Compose
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d --build

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ 2>/dev/null || echo "000")
            if [ "$STATUS" != "000" ]; then
              echo "App is ready (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "App failed to start after 5 minutes"
          docker compose logs app
          exit 1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: schedule-testing/e2e/requirements.txt

      - name: Install Python dependencies
        run: pip install -r schedule-testing/e2e/requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: schedule-testing/e2e
        run: >
          pytest
          --html=../../e2e-report-py${{ matrix.python-version }}.html
          --self-contained-html
        env:
          BASE_URL: http://localhost:8081
          API_URL: http://localhost:8081
          ADMIN_EMAIL: manager@gmail.com
          ADMIN_PASSWORD: Qwerty!123
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: appdb
          DB_USER: postgres
          DB_PASSWORD: postgres
          HEADLESS: "true"
          SLOW_MO: "0"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-python-${{ matrix.python-version }}
          path: e2e-report-py${{ matrix.python-version }}.html
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down

  # ============================================================
  # Task 4 — Summary (badge in README.md; artifacts above count too)
  # ============================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Unit Tests:  ${{ needs.unit-tests.result }}"
          echo "API Tests:   ${{ needs.api-tests.result }}"
          echo "E2E Tests:   ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" == "failure" ] || \
             [ "${{ needs.api-tests.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "Some tests failed!"
            exit 1
          fi

          echo "All tests passed!"
