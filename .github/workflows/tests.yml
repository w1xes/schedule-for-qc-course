name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # CI environment for the Spring Boot backend
  DB_URL: jdbc:postgresql://localhost:5432/appdb
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: ci-test-secret-that-is-at-least-256-bits-long-for-testing-purposes-only
  JWT_EXPIRED: 24h
  LIQUIBASE_ENABLED: "true"
  REDIS_URL: redis://localhost:6379
  BACKEND_URL: http://localhost:8081
  CORS_ORIGINS: http://localhost:8081
  PORT: "8081"
  GOOGLE_CLIENT_ID: disabled
  GOOGLE_CLIENT_SECRET: disabled
  FACEBOOK_CLIENT_ID: disabled
  FACEBOOK_CLIENT_SECRET: disabled
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  HIBERNATE_SHOW_SQL: "false"

jobs:
  # ============================================
  # Unit Tests (Jest — frontend)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false '--coverageThreshold={}'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

  # ============================================
  # Build Backend JAR (shared artifact)
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/*.jar
          retention-days: 1

  # ============================================
  # API Tests (Newman / Postman) — real backend
  # ============================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, build-backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar/

      - name: Start backend
        run: |
          java -jar backend-jar/*.jar &
          echo "Waiting for backend on port 8081..."
          for i in $(seq 1 60); do
            CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 3 http://localhost:8081 || true)
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              echo "Backend is up (HTTP $CODE)"
              break
            fi
            echo "Attempt $i/60 — not ready yet, waiting 5s..."
            sleep 5
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests
        run: |
          newman run "schedule-testing/tests/api/postman/Schedule_API_Tests.postman_collection.json" \
            -e "schedule-testing/tests/api/postman/schedule-local.postman_environment.json" \
            -r htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: newman-report.html
          retention-days: 7

  # ============================================
  # E2E Tests (pytest + Playwright) — real backend, Python matrix
  # ============================================
  e2e-tests:
    name: E2E Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [build-backend, api-tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar/

      - name: Start backend
        run: |
          java -jar backend-jar/*.jar &
          echo "Waiting for backend on port 8081..."
          for i in $(seq 1 60); do
            CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 3 http://localhost:8081 || true)
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              echo "Backend is up (HTTP $CODE)"
              break
            fi
            echo "Attempt $i/60 — not ready yet, waiting 5s..."
            sleep 5
          done

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: schedule-testing/e2e/requirements.txt

      - name: Install Python dependencies
        working-directory: schedule-testing/e2e
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: schedule-testing/e2e
        run: pytest tests/ --html=pytest-report.html --self-contained-html -v
        env:
          BASE_URL: http://localhost:8081
          API_URL: http://localhost:8081

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: schedule-testing/e2e/pytest-report.html
          retention-days: 7

  # ============================================
  # Summary
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Unit Tests:   ${{ needs.unit-tests.result }}"
          echo "API Tests:    ${{ needs.api-tests.result }}"
          echo "E2E Tests:    ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" == "failure" ] || \
             [ "${{ needs.api-tests.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "One or more jobs failed!"
            exit 1
          fi

          echo "All tests passed!"
